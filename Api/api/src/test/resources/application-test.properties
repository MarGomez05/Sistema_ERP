# Perfil de pruebas: Testcontainers aporta el datasource y Flyway crea el esquema.
# Sin Docker, usar TEST_DB_MODE=local-pg y apuntar TEST_DB_URL a un esquema vacío.
test.db.mode=${TEST_DB_MODE:container}

spring.datasource.url=${TEST_DB_URL:}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.default-schema=${TEST_DB_SCHEMA:public}
spring.flyway.schemas=${TEST_DB_SCHEMA:public}
spring.flyway.create-schemas=true

# Secreto exclusivo de pruebas; nunca usar en producción.
