# Application
spring.application.name=tamachihua-erp-api

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600

# Company data printed on invoice PDFs. Override with environment variables.
app.company.name=${COMPANY_NAME:MARERP S.A. DE C.V.}
app.company.nit=${COMPANY_NIT:06852248-1}
app.company.nrc=${COMPANY_NRC:123456-7}
app.company.address=${COMPANY_ADDRESS:Lourdes Colón, La Libertad}
app.company.phone=${COMPANY_PHONE:2578-2910}
app.company.email=${COMPANY_EMAIL:admin@elprogreso.example}

# Flyway: fuente oficial del esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true